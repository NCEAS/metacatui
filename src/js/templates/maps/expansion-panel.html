<div class="<%= classNames.TOGGLE %>">
  <div class="<%= classNames.ICON %>">
    <%if(isSvgIcon) {%>
      <%= icon %>
    <%} else {%>
      <i class="<%= classNames.ICON_FONT %> <%= icon %>"></i>
    <%}%>
  </div>
  <div class="<%= classNames.TITLE %>">
    <%= title %>
  </div>
  <div class="<%= classNames.ICON_TOGGLE %>">
    <i class="<%= classNames.ICON_FONT %> <%= classNames.CARET_DOWN %>"></i>
    <i class="<%= classNames.ICON_FONT %> <%= classNames.CARET_UP %>"></i>
  </div>
</div>

<div class="<%= classNames.CONTENT %>"></div>
