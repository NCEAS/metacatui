<div class="visualization-panel__header">
  <button class="visualization-panel__close-button map-view__button" type="button" aria-label="Close visualization"><i class="icon-remove"></i></button>
</div>
<div class="visualization-panel__body">
  <iframe
    class="visualization-panel__iframe"
    title="Visualization"
    allowfullscreen
  ></iframe>
  <div class="visualization-panel__untrusted" style="display:none">
    <p>This content cannot be displayed here because its source is not in the list of trusted sources.</p>
    <a class="visualization-panel__untrusted-link map-view__button map-view__button--emphasis" target="_blank" rel="noopener noreferrer">
      <i class="icon icon-external-link"></i>
      Open in Browser
    </a>
  </div>
</div>
