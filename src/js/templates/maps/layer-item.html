<button
  class="<%= classNames.VISIBILITY_TOGGLE %> <%= classNames.BUTTON %>"
  title="Toggle layer visibility"
>
  <i class="<%= classNames.VISIBILITY_ICON %>"></i>
</button>

<span class="<%= classNames.LABEL %>">
  <!-- Title needed for when label overflows -->
  <span class="<%= classNames.LABEL_TEXT %>" title="<%- label %>">
    <%= label %>
  </span>
</span>

<span class="<%= classNames.SETTINGS %>">
  <i
    class="<%= classNames.SETTINGS_ICON %> <%= classNames.SETTINGS_TOGGLE %>"
  ></i>
</span>
